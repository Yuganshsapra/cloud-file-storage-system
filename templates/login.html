<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cloud File Storage</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef2ff;
}

.container{
    width:100%;
    max-width:450px;
    padding:20px;
}

.card{
    background:white;
    padding:50px 40px;
    border-radius:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.1);
    text-align:center;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    margin-bottom:25px;
    background:linear-gradient(to right,#2563eb,#38bdf8);
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    color:white;
}

h1{
    color:#1e293b;
    margin-bottom:10px;
    font-size:34px;
}

.subtitle{
    color:#64748b;
    margin-bottom:40px;
    font-size:16px;
}

.google-btn{
    text-decoration:none;
    background:#2563eb;
    color:white;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:15px 28px;
    border-radius:15px;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.google-btn:hover{
    background:#1d4ed8;
    transform:translateY(-3px);
}

.info{
    margin-top:35px;
    color:#64748b;
    font-size:14px;
    line-height:24px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
☁
</div>

<h1>Cloud File Storage</h1>

<p class="subtitle">
Secure cloud storage powered by AWS S3
</p>

<a href="/login" class="google-btn">
🔐 Login with Google
</a>

<div class="info">
Secure • Fast • Reliable
</div>

</div>

</div>

</body>
</html>
